<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Shutter — Archive</title>
<link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script>
</head>
<body>
<header><a class="brand" href="/">SHUTTER<span>·</span></a><div class="tools"><input id="query" type="search" placeholder="Search archive"><select id="type"><option value="">All types</option><option>image</option><option>video</option><option>audio</option><option>doc</option></select><select id="tag"><option value="">All tags</option></select><button id="upload-open">＋ Upload</button><button id="logout" class="quiet hidden">Log out</button></div></header>
<main><section id="login" class="login"><p class="eyebrow">PRIVATE COLLECTION</p><h1>Keep what<br><em>moves you.</em></h1><form id="login-form"><input type="password" id="password" placeholder="Archive password" required autocomplete="current-password"><button>Unlock archive</button><p id="login-error"></p></form></section>
<section id="archive" class="hidden"><div class="heading"><div><p class="eyebrow">YOUR COLLECTION</p><h1>Archive</h1></div><span id="count"></span></div><div id="drop" class="drop">Drop files here or <button id="upload-inline" class="link">choose files</button><input id="files" type="file" multiple hidden accept="image/*,video/*,audio/*,.pdf,.txt,.rtf,.docx,.xlsx"></div><div id="progress"></div><div id="grid" class="grid"></div><p id="status"></p><button id="more" class="quiet hidden">Load more</button></section></main>
<dialog id="detail"><button id="close" class="close">×</button><div id="detail-body"></div></dialog>
</body></html>
